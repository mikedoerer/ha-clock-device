name: Release

# HACS shows a real version number only when a repo has GitHub Releases; without
# any, it falls back to displaying the raw commit hash of `main` instead. This
# turns each manifest.json version bump on main into a matching tagged release
# (skipped if that tag already exists, so an unrelated push to main is a no-op).

on:
  push:
    branches: [main]
    paths:
      - "custom_components/alarm_clock/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"

      - name: Read and validate version from manifest.json
        id: version
        run: |
          version=$(jq -r '.version' custom_components/alarm_clock/manifest.json)
          # Strict X.Y.Z check before this value goes anywhere near GITHUB_OUTPUT
          # or a later shell command - it rules out both output-injection (a
          # crafted value forging extra "key=value" lines) and script injection
          # (shell metacharacters) at the source, regardless of how the value
          # is used downstream.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version '$version' doesn't look like X.Y.Z, refusing to release"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
