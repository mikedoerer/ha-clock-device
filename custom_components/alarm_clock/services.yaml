snooze:
  name: Snooze
  description: >-
    Stops the ringing alarm and lets it ring again after the snooze
    duration.
  target:
    entity:
      integration: alarm_clock
  fields:
    duration:
      name: Duration
      description: >-
        Overrides the configured snooze duration (minutes) for this one
        time.
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

stop:
  name: Stop
  description: Fully stops the ringing or snoozed alarm.
  target:
    entity:
      integration: alarm_clock

set_onetime:
  name: Set one-time alarm
  description: >-
    Sets the time (and optionally date) of the one-time alarm and enables
    it, atomically.
  target:
    entity:
      integration: alarm_clock
  fields:
    time:
      name: Time
      description: Time the alarm should ring.
      required: true
      selector:
        time:
    date:
      name: Date
      description: >-
        Date the alarm should ring on. Without a date, rolls to the next
        occurrence of the given time (today if not yet passed, otherwise
        tomorrow).
      required: false
      selector:
        date:

set_recurring:
  name: Set recurring alarm
  description: Sets the time for one or more weekdays and enables them, atomically.
  target:
    entity:
      integration: alarm_clock
  fields:
    weekday:
      name: Weekday
      description: One or more weekdays (or "all") to set.
      required: true
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - all
    time:
      name: Time
      description: Time the alarm should ring on the given weekday(s).
      required: true
      selector:
        time:

delete_onetime:
  name: Delete one-time alarm
  description: >-
    Deletes the one-time alarm. If more than one is currently set on this
    alarm clock, pass date to say which one to delete - without a date,
    this only succeeds when exactly one one-time alarm is set, and errors
    otherwise rather than guessing.
  target:
    entity:
      integration: alarm_clock
  fields:
    date:
      name: Date
      description: >-
        Date of the specific one-time alarm to delete. Required whenever
        more than one one-time alarm is currently set on the target alarm
        clock.
      required: false
      selector:
        date:

delete_recurring:
  name: Delete recurring alarm
  description: >-
    Deletes every recurring alarm currently set on the given weekday(s),
    including all of them if more than one time is armed on the same day.
  target:
    entity:
      integration: alarm_clock
  fields:
    weekday:
      name: Weekday
      description: One or more weekdays (or "all") to delete every alarm on.
      required: true
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - all

delete_alarm:
  name: Delete alarm
  description: >-
    Deletes a single alarm (recurring or one-time) by its id, regardless
    of weekday/date - use this to remove one specific entry from a longer
    list, e.g. from the alarms attribute of the next-alarm sensor.
  target:
    entity:
      integration: alarm_clock
  fields:
    alarm_id:
      name: Alarm ID
      description: >-
        The id of the alarm to delete, as listed in the alarms attribute
        of the target alarm clock's next-alarm sensor.
      required: true
      selector:
        number:
          min: 1
          mode: box
