language: "de"
lists:
  wecker_weekday:
    values:
      - in: "montag[s]"
        out: "mon"
      - in: "dienstag[s]"
        out: "tue"
      - in: "mittwoch[s]"
        out: "wed"
      - in: "donnerstag[s]"
        out: "thu"
      - in: "freitag[s]"
        out: "fri"
      - in: "samstag[s]"
        out: "sat"
      - in: "sonntag[s]"
        out: "sun"
      - in: "(jeden tag|täglich)"
        out: "all"
  wecker_weekday_bare:
    values:
      - in: "montag"
        out: "mon"
      - in: "dienstag"
        out: "tue"
      - in: "mittwoch"
        out: "wed"
      - in: "donnerstag"
        out: "thu"
      - in: "freitag"
        out: "fri"
      - in: "samstag"
        out: "sat"
      - in: "sonntag"
        out: "sun"
  wecker_weekday_bare_recurring:
    values:
      - in: "montags"
        out: "mon"
      - in: "dienstags"
        out: "tue"
      - in: "mittwochs"
        out: "wed"
      - in: "donnerstags"
        out: "thu"
      - in: "freitags"
        out: "fri"
      - in: "samstags"
        out: "sat"
      - in: "sonntags"
        out: "sun"
      - in: "(jeden tag|täglich)"
        out: "all"
  wecker_relative_day:
    values:
      - in: "heute"
        out: "today"
      - in: "morgen"
        out: "tomorrow"
  wecker_month:
    values:
      - in: "januar"
        out: "1"
      - in: "februar"
        out: "2"
      - in: "märz"
        out: "3"
      - in: "april"
        out: "4"
      - in: "mai"
        out: "5"
      - in: "juni"
        out: "6"
      - in: "juli"
        out: "7"
      - in: "august"
        out: "8"
      - in: "september"
        out: "9"
      - in: "oktober"
        out: "10"
      - in: "november"
        out: "11"
      - in: "dezember"
        out: "12"
intents:
  WeckerSnooze:
    data:
      - sentences:
          - "schlummern"
          - "wecker schlummern"
          - "wecker schlummer"
  WeckerStop:
    data:
      - sentences:
          - "wecker beenden"
          - "wecker aus"
          - "wecker stoppen"
          - "wecker ausschalten"
  WeckerSetRecurring:
    data:
      - sentences:
          - "wecker [jeden ]{wecker_weekday} auf {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker für [jeden ]{wecker_weekday} auf {0..23:hour} uhr [{0..59:minute}]"
          - "wecker jeden {wecker_weekday:wecker_weekday_from} bis {wecker_weekday:wecker_weekday_to} auf {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker für jeden {wecker_weekday:wecker_weekday_from} bis {wecker_weekday:wecker_weekday_to} auf {0..23:hour} uhr [{0..59:minute}]"
          - "wecker {wecker_weekday_bare_recurring:wecker_weekday} {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "wecker jeden {wecker_weekday:wecker_weekday_from} bis {wecker_weekday:wecker_weekday_to} {0..23:hour} uhr [{0..59:minute}][ stellen]"
  WeckerSetOnetime:
    data:
      - sentences:
          - "wecker {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "wecker um {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker auf {0..23:hour} uhr [{0..59:minute}]"
          - "wecker {wecker_relative_day} um {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker {wecker_relative_day} auf {0..23:hour} uhr [{0..59:minute}]"
          - "wecker {wecker_weekday} um {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker für {wecker_weekday} um {0..23:hour} uhr [{0..59:minute}]"
          - "wecker {wecker_weekday_bare:wecker_weekday} {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "wecker am {1..31:day}[.] {wecker_month} um {0..23:hour} uhr [{0..59:minute}][ stellen]"
          - "stelle den wecker für den {1..31:day}[.] {wecker_month} auf {0..23:hour} uhr [{0..59:minute}]"
  WeckerDeleteRecurring:
    data:
      - sentences:
          - "wecker [jeden ]{wecker_weekday} löschen"
          - "lösche den wecker für [jeden ]{wecker_weekday}"
          - "wecker jeden {wecker_weekday:wecker_weekday_from} bis {wecker_weekday:wecker_weekday_to} löschen"
          - "lösche den wecker für jeden {wecker_weekday:wecker_weekday_from} bis {wecker_weekday:wecker_weekday_to}"
  WeckerDeleteOnetime:
    data:
      - sentences:
          - "wecker löschen"
          - "lösche den wecker"
